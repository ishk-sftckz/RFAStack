services:
  database:
    image: postgres:17-alpine
    ports: ['5412:5432']
    environment:
      POSTGRES_USER: rfa
      POSTGRES_PASSWORD: rfa
      POSTGRES_DB: fulfillment
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rfa -d fulfillment']
      interval: 2s
      timeout: 5s
      retries: 20
    volumes: ['database:/var/lib/postgresql/data']
volumes:
  database:
